name: CI Testing & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: qorkme

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            qorkme/package-lock.json
            qorkme/guide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check .

      - name: Run tests
        run: npm test

      - name: Build application
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-key-for-build' }}
          NEXT_PUBLIC_SITE_URL: https://qork.me
          NEXT_PUBLIC_SHORT_DOMAIN: qork.me

      - name: Check bundle size
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          echo "Build size report:"
          du -sh .next/

  install-cli:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install and launch qork on macOS or Linux
        if: runner.os != 'Windows'
        run: |
          export QORK_UNMANAGED_INSTALL="$RUNNER_TEMP/qork-smoke"
          sh public/install.sh
          "$QORK_UNMANAGED_INSTALL/qork" --version
      - name: Install and launch qork on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:QORK_UNMANAGED_INSTALL = Join-Path $env:RUNNER_TEMP 'qork-smoke'
          & ./public/install.ps1
          & (Join-Path $env:QORK_UNMANAGED_INSTALL 'qork.exe') --version

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, install-cli]
    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        working-directory: qorkme

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            qorkme/package-lock.json
            qorkme/guide/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: |
          vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }} > deployment-url.txt
          echo "Deployment complete!"
          cat deployment-url.txt

      - name: Comment on commit with production URL
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('qorkme/deployment-url.txt', 'utf8').trim();
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Successfully deployed to Vercel!\n\n🔗 Production URL: ${url}`
            });
